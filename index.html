<html lang="en">

<title>Lunlo</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --white:#FFFFFF;
  --bg:#F7F8FA;
  --s1:#FFFFFF;
  --s2:#F2F4F7;
  --s3:#EAECF0;
  --line:#E4E7EC;
  --line2:#F2F4F7;
  --t1:#101828;
  --t2:#344054;
  --t3:#667085;
  --t4:#98A2B3;
  --t5:#D0D5DD;
  --green:#027A48;
  --green-bg:#ECFDF3;
  --green-dot:#12B76A;
  --red:#B42318;
  --red-bg:#FEF3F2;
  --red-dot:#F04438;
  --amber:#B54708;
  --amber-bg:#FFFAEB;
  --amber-dot:#F79009;
  --accent:#101828;
  --r:16px;--rsm:12px;--rxs:8px;
  --sh:0 1px 2px rgba(16,24,40,.05);
  --sh2:0 4px 8px rgba(16,24,40,.08),0 2px 4px rgba(16,24,40,.04);
  --sh3:0 12px 24px rgba(16,24,40,.1),0 4px 8px rgba(16,24,40,.06);
}
html,body{height:100%;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{background:var(--bg);color:var(--t1);font-family:'Plus Jakarta Sans',sans-serif;font-weight:400;font-size:15px;padding-bottom:80px;overflow-x:hidden;min-height:100vh}
.topbar{position:sticky;top:0;z-index:300;background:rgba(255,255,255,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--line);height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;box-shadow:0 1px 0 rgba(16,24,40,.05)}
.topbar-logo{height:44px;width:auto;object-fit:contain}
.topbar-right{display:flex;align-items:center;gap:10px}
.mo-chip{display:flex;align-items:center;gap:6px;background:var(--s2);border:1px solid var(--line);border-radius:20px;padding:8px 14px 8px 16px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:600;color:var(--t2);transition:all .15s;white-space:nowrap;box-shadow:var(--sh)}
.mo-chip:hover{background:var(--s3);border-color:var(--t5)}
.mo-chip svg{width:10px;height:10px;opacity:.4}
.ico{width:38px;height:38px;border-radius:50%;background:var(--s2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:var(--t3);transition:all .15s;box-shadow:var(--sh)}
.ico:hover{background:var(--s3);color:var(--t1)}
.view{display:none;flex-direction:column;animation:vf .18s ease}
.view.active{display:flex}
@keyframes vf{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:300;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);display:flex;padding:0 0 calc(env(safe-area-inset-bottom));box-shadow:0 -1px 0 rgba(16,24,40,.05)}
.nbtn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:none;border:none;font-family:'Plus Jakarta Sans',sans-serif;font-size:10px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;color:var(--t4);cursor:pointer;transition:color .2s;padding:12px 0 14px}
.nbtn.active{color:var(--t1)}
.nbtn svg{width:22px;height:22px;stroke-width:1.8}
.dash{padding:20px 20px 8px;display:flex;flex-direction:column;gap:16px}
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--t1);color:#fff;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:700;padding:10px 20px;border-radius:20px;opacity:0;transition:all .22s;z-index:999;white-space:nowrap;pointer-events:none;box-shadow:var(--sh3)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty-state{text-align:center;padding:48px 24px}
.empty-icon{width:52px;height:52px;border:2px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:var(--t4)}
.empty-title{font-size:17px;font-weight:700;color:var(--t1);margin-bottom:6px}
.empty-sub{font-size:14px;color:var(--t3);line-height:1.6}
</style>
</head>
<body>

<header class="topbar">
  <img class="topbar-logo" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAASwAAAEsCAYAAAB5fY51AAAon0lEQVR42u2debxkVXXvf6uqbjfNjMwYRpknERwCigOoOCDiBBGjz4eCAz5IEMQ5xjFKXlTwqYka48AgGEUDeRoHFEFQMCKoyCygSIPI2HTfW3Xqlz/O2tbq3efUcKvu7dvw+34+9am6deucs8+ps3+11tprrw0IIYQQQgghhBBCCCGEEEIIIYQQQgghhBBCCCGEEEIIIYQQQgghhBBCCCGEEEIIIYQQQgghhBBCCCGEEEIIIYQQQgghhBBCCCGEEEIIIYQQQgghhBBCCCGEEEIIIYQQQgghhBBCCCGEEEIIIYQQQgghhBBCCCGEEEIIIYQQQgghhBBCCCGEEEIIIYQQQgghhBBCCCGEEEIIIYQQQgghhBBCCCGEEEIIIYQQQgghhBBCCCGEEEIIIYQQQgghhBBCCCGEEEIIIYQQQgghhBBCCCGEEEIIIYQQQgghhBBCCCGEEEIIIYQQQgghhBBCCCGEEEIIIYQQQgghhBBCCCGEEEIIIYQQQgghhBBCCCGEEEIIIYQQQgghhBBCCCGEEEIIIYQQQgghhBBCCCGEEEIIIYQQQgghhBBCCCGEEEIIIYQQQgghhBBCCCGEEEIIIYQQQgghhBBCCCGEEEIIIYQQQgghhBBCCCGEEEIIIYQQQgghhBBCCCGEEEIIIYQQQgghhBBCCCGEEEIIIYQQQgghhBBCCCGEEEIIIYQQQgghhBBCCCGEEEIIIYQQQgghhBBCCCGEEEIIIYQQQgghxJrG/wD2aJ9HRy5rXwAAAABJRU5ErkJggg==" alt="Lunlo">
  <div class="topbar-right">
    <div class="mo-chip" id="moChip" onclick="openMoPicker()">
      <span id="moLabel">March 2026</span>
      <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 4l4 4 4-4" stroke-linecap="round"/></svg>
    </div>
    <button class="ico" onclick="exportExcel()" title="Export to Excel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="15" y1="21" x2="15" y2="9"/></svg>
    </button>
    <button class="ico" onclick="openDup()" title="Duplicate">&#x2398;</button>
  </div>
</header>

<div class="view active" id="view-dash"><div class="dash" id="dashC"><div class="empty-state"><div class="empty-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg></div><div class="empty-title">No budget yet</div><div class="empty-sub">Open the Budget tab and enter<br>your income and expenses to get started.</div></div></div></div>

<nav class="bnav">
  <button class="nbtn active" id="navDash" onclick="sv('dash')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Dashboard</button>
  <button class="nbtn" id="navBudget" onclick="sv('budget')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>Budget</button>
  <button class="nbtn" id="navAnnual" onclick="sv('annual')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>Annual</button>
</nav>

<div class="toast" id="toast"></div>

<script>
const MO=['January','February','March','April','May','June','July','August','September','October','November','December'];
let curMo=2,curYr=2026;

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}

function exportExcel(){
  const DATA=JSON.parse(localStorage.getItem('lunlo_data')||'{}');
  const wb=XLSX.utils.book_new();
  const ws_data=[];
  
  ws_data.push([`Lunlo Budget Report - ${MO[curMo]} ${curYr}`]);
  ws_data.push([]);
  
  const k=`${curYr}-${String(curMo).padStart(2,'0')}`;
  const groups=DATA[k]?.groups||[];
  
  if(groups.length===0){
    ws_data.push(['No budget data for this month']);
  }else{
    groups.forEach(g=>{
      ws_data.push([g.label]);
      ws_data.push(['Line Item','Budgeted','Actual','Remaining']);
      g.secs.forEach(s=>{
        s.rows.forEach(r=>{
          ws_data.push([r.n,r.b,r.a,r.b-r.a]);
        });
      });
      const gb=g.secs.reduce((a,s)=>a+s.rows.reduce((x,r)=>x+r.b,0),0);
      const ga=g.secs.reduce((a,s)=>a+s.rows.reduce((x,r)=>x+r.a,0),0);
      ws_data.push([g.label+' Total',gb,ga,gb-ga]);
      ws_data.push([]);
    });
    
    const totalInc=groups.find(g=>g.key==='income')?.secs.reduce((a,s)=>a+s.rows.reduce((x,r)=>x+r.b,0),0)||0;
    const totalExp=groups.filter(g=>g.key!=='income').reduce((a,g)=>a+g.secs.reduce((x,s)=>x+s.rows.reduce((y,r)=>y+r.b,0),0),0);
    
    ws_data.push(['Summary']);
    ws_data.push(['Total Income',totalInc]);
    ws_data.push(['Total Expenses',totalExp]);
    ws_data.push(['Net',totalInc-totalExp]);
  }
  
  const ws=XLSX.utils.aoa_to_sheet(ws_data);
  ws['!cols']=[{wch:30},{wch:15},{wch:15},{wch:15}];
  XLSX.utils.book_append_sheet(wb,ws,'Budget');
  XLSX.writeFile(wb,`Lunlo_${MO[curMo]}_${curYr}.xlsx`);
  toast('Exported to Excel');
}

function sv(v){}
function openMoPicker(){}
function openDup(){}
</script>
</body>
</html>
