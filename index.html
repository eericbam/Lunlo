<title>Lunlo</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ── RESET ── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#080808;
  --ink2:#0F0F0F;
  --ink3:#161616;
  --ink4:#1E1E1E;
  --line:#272727;
  --line2:#1C1C1C;
  --t1:#F4F4F4;
  --t2:#A8A8A8;
  --t3:#525252;
  --t4:#363636;
  --green:#22C55E;
  --green-muted:#16A34A;
  --red:#EF4444;
  --amber:#F59E0B;
  --accent:#F4F4F4;
  --r:16px;--rsm:10px;--rxs:6px;
}
html,body{height:100%;background:var(--ink);-webkit-font-smoothing:antialiased}
body{color:var(--t1);font-family:'Inter',sans-serif;font-weight:400;font-size:14px;padding-bottom:72px;overflow-x:hidden;min-height:100vh}

/* ── TOPBAR ── */
.topbar{
  position:sticky;top:0;z-index:300;
  background:rgba(8,8,8,.9);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-bottom:1px solid var(--line2);
  height:60px;display:flex;align-items:center;
  justify-content:space-between;padding:0 20px;
}
.topbar-logo{height:40px;width:auto;object-fit:contain;filter:invert(1) brightness(.9)}
.topbar-right{display:flex;align-items:center;gap:8px}
.chip{
  display:flex;align-items:center;gap:5px;
  background:var(--ink3);border:1px solid var(--line);
  border-radius:20px;padding:7px 14px 7px 16px;
  cursor:pointer;font-family:'Inter',sans-serif;
  font-size:12px;font-weight:500;color:var(--t2);
  transition:all .15s;white-space:nowrap;
}
.chip:hover{border-color:var(--t4);color:var(--t1)}
.chip svg{width:9px;height:9px;opacity:.35;flex-shrink:0}
.ico{
  width:36px;height:36px;border-radius:50%;
  background:transparent;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:16px;color:var(--t3);
  transition:all .15s;font-family:'Inter',sans-serif;
}
.ico:hover{background:var(--ink3);color:var(--t1);border-color:var(--t4)}

/* ── VIEW SYSTEM ── */
.view{display:none;flex-direction:column;animation:vfade .2s ease}
.view.active{display:flex}
@keyframes vfade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}

/* ── BOTTOM NAV ── */
.bnav{
  position:fixed;bottom:0;left:0;right:0;z-index:300;
  background:rgba(8,8,8,.95);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-top:1px solid var(--line2);
  display:flex;padding:0 0 calc(env(safe-area-inset-bottom));
}
.nbtn{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;background:none;border:none;
  font-family:'Inter',sans-serif;font-size:9px;font-weight:500;
  letter-spacing:.5px;text-transform:uppercase;
  color:var(--t4);cursor:pointer;transition:color .2s;
  padding:12px 0 14px;
}
.nbtn.active{color:var(--t1)}
.nbtn svg{width:20px;height:20px;stroke-width:1.5}

/* ── DASHBOARD ── */
.dash-scroll{padding:20px 20px 8px;display:flex;flex-direction:column;gap:16px}

/* Hero */
.hero{
  background:var(--ink2);border:1px solid var(--line);
  border-radius:var(--r);padding:24px;
  position:relative;overflow:hidden;
}
.hero::before{
  content:'';position:absolute;top:0;right:0;
  width:200px;height:200px;
  background:radial-gradient(circle,rgba(255,255,255,.03) 0%,transparent 70%);
  pointer-events:none;
}
.hero-label{font-size:10px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3);margin-bottom:10px}
.hero-amount{font-family:'Syne',sans-serif;font-size:48px;font-weight:700;letter-spacing:-2px;line-height:1;color:var(--t1);margin-bottom:4px}
.hero-amount.neg{color:var(--red)}
.hero-sub{font-size:11px;color:var(--t3);margin-bottom:24px}
.hero-divider{height:1px;background:var(--line);margin-bottom:20px}
.hero-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0}
.hstat{padding:0 16px}
.hstat:first-child{padding-left:0}
.hstat:last-child{padding-right:0;text-align:right}
.hstat-v{font-family:'Syne',sans-serif;font-size:20px;font-weight:600;color:var(--t1);margin-bottom:3px}
.hstat-v.pos{color:var(--green)}
.hstat-v.neg{color:var(--red)}
.hstat-l{font-size:9px;font-weight:500;letter-spacing:.8px;text-transform:uppercase;color:var(--t3)}
.hstat-sep{width:1px;background:var(--line);margin:4px 0}

/* Progress ring */
.prog-card{background:var(--ink2);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.prog-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.prog-title{font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--t2)}
.prog-pct{font-family:'Syne',sans-serif;font-size:22px;font-weight:700;color:var(--t1)}
.prog-track{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:10px}
.prog-fill{height:100%;border-radius:2px;background:var(--t1);transition:width .8s cubic-bezier(.4,0,.2,1)}
.prog-fill.warn{background:var(--amber)}
.prog-fill.danger{background:var(--red)}
.prog-sub{display:flex;justify-content:space-between;font-size:11px;color:var(--t3)}

/* Stat grid */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat-card{background:var(--ink2);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stat-eye{font-size:9px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--t3);margin-bottom:6px}
.stat-val{font-family:'Syne',sans-serif;font-size:26px;font-weight:700;color:var(--t1);line-height:1;margin-bottom:4px}
.stat-val.pos{color:var(--green)}
.stat-val.neg{color:var(--red)}
.stat-sub{font-size:11px;color:var(--t3)}

/* Breakdown */
.breakdown-card{background:var(--ink2);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.bk-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.bk-title{font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--t2)}
.bk-total{font-family:'Syne',sans-serif;font-size:16px;font-weight:600;color:var(--t3)}

.bk-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2)}
.bk-row:last-child{border:none;padding-bottom:0}
.bk-row:first-child{padding-top:0}
.bk-rank{font-size:10px;font-weight:700;color:var(--t4);min-width:16px}
.bk-name{flex:1;font-size:12px;font-weight:400;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk-bar-wrap{width:64px;height:3px;background:var(--line);border-radius:2px;overflow:hidden;flex-shrink:0}
.bk-bar{height:100%;border-radius:2px;background:var(--t2);transition:width .6s}
.bk-pct{font-size:10px;color:var(--t4);min-width:28px;text-align:right;flex-shrink:0}
.bk-amt{font-family:'Syne',sans-serif;font-size:13px;font-weight:600;color:var(--t1);min-width:50px;text-align:right;flex-shrink:0}

/* Trend card */
.trend-card{background:var(--ink2);border:1px solid var(--line);border-radius:var(--r);padding:20px 20px 14px}
.trend-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.trend-title{font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--t2)}
.trend-legend{display:flex;gap:12px}
.trend-leg-item{display:flex;align-items:center;gap:5px;font-size:9px;color:var(--t3)}
.trend-leg-dot{width:12px;height:3px;border-radius:2px}

.empty-state{text-align:center;padding:48px 24px}
.empty-icon{width:48px;height:48px;border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:var(--t4)}
.empty-text{font-size:13px;color:var(--t3);line-height:1.6}

/* ── BUDGET VIEW ── */
.bv-top{
  padding:20px 20px 0;
  display:flex;align-items:center;justify-content:space-between;
}
.bv-month{font-family:'Syne',sans-serif;font-size:24px;font-weight:700;color:var(--t1)}
.add-btn{
  display:flex;align-items:center;gap:6px;
  background:var(--t1);color:var(--ink);
  border:none;border-radius:20px;
  font-family:'Inter',sans-serif;font-size:11px;font-weight:600;
  padding:8px 16px;cursor:pointer;transition:opacity .15s;
}
.add-btn:hover{opacity:.85}

/* Budget summary strip */
.bv-strip{
  display:grid;grid-template-columns:1fr 1fr 1fr;
  gap:1px;background:var(--line2);
  border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);
  margin-top:16px;
}
.bvs-cell{background:var(--ink);padding:14px 16px}
.bvs-eye{font-size:9px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--t3);margin-bottom:5px}
.bvs-val{font-family:'Syne',sans-serif;font-size:20px;font-weight:700;color:var(--t1);line-height:1}
.bvs-val.pos{color:var(--green)}
.bvs-val.neg{color:var(--red)}

/* Group section */
.bv-groups{padding:16px 16px 24px;display:flex;flex-direction:column;gap:12px}

.bv-group{background:var(--ink2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}

.grp-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;border-bottom:1px solid var(--line2);
}
.grp-head-left{display:flex;align-items:center;gap:10px}
.grp-name{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;letter-spacing:.3px;color:var(--t1)}
.grp-badge{
  background:var(--ink3);border:1px solid var(--line);
  border-radius:4px;font-size:9px;font-weight:600;
  color:var(--t4);padding:2px 7px;letter-spacing:.3px;
}
.grp-head-right{display:flex;align-items:center;gap:16px;flex-shrink:0}
.grp-stat{text-align:right}
.grp-stat-lbl{font-size:8px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--t4);margin-bottom:2px}
.grp-stat-val{font-family:'Syne',sans-serif;font-size:14px;font-weight:600;color:var(--t1)}
.grp-stat-val.pos{color:var(--green)}
.grp-stat-val.neg{color:var(--red)}

/* Col headers */
.col-row{
  display:grid;grid-template-columns:1fr 88px 88px;
  gap:8px;padding:7px 16px;
  background:var(--ink3);border-bottom:1px solid var(--line2);
}
.col-lbl{font-size:8px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--t4);text-align:right}
.col-lbl:first-child{text-align:left}

/* Row item */
.bv-row{
  display:grid;grid-template-columns:1fr 88px 88px;
  gap:8px;padding:11px 16px;
  border-bottom:1px solid var(--line2);
  align-items:center;transition:background .1s;
}
.bv-row:hover{background:var(--ink3)}
.row-left{position:relative}
.row-name{font-size:12px;color:var(--t1);font-weight:400;line-height:1.3;padding-right:4px}
.row-prog{height:2px;background:var(--line);border-radius:1px;overflow:hidden;margin-top:5px}
.row-prog-fill{height:100%;border-radius:1px;background:var(--t3);transition:width .5s cubic-bezier(.4,0,.2,1)}
.row-prog-fill.good{background:var(--green-muted)}
.row-prog-fill.warn{background:var(--amber)}
.row-prog-fill.over{background:var(--red)}

.inp-wrap{position:relative}
.inp-sym{
  position:absolute;left:0;top:50%;transform:translateY(-50%);
  font-size:10px;color:var(--t4);pointer-events:none;line-height:1;
}
.num-inp{
  width:100%;background:transparent;
  border:none;border-bottom:1px solid var(--line);
  color:var(--t1);font-family:'Syne',sans-serif;
  font-size:13px;font-weight:600;
  padding:3px 0 3px 13px;
  outline:none;text-align:right;
  -moz-appearance:textfield;
  transition:border-color .15s;
}
.num-inp::-webkit-inner-spin-button,.num-inp::-webkit-outer-spin-button{-webkit-appearance:none}
.num-inp:focus{border-bottom-color:var(--t1)}
.num-inp::placeholder{color:var(--line)}

.del-btn{
  position:absolute;right:0;top:50%;transform:translateY(-50%);
  background:none;border:none;color:var(--red);
  opacity:0;font-size:12px;cursor:pointer;
  padding:3px;line-height:1;transition:opacity .15s;
}
.bv-row:hover .del-btn{opacity:.5}
.del-btn:hover{opacity:1!important}

/* Remain tag */
.remain-row{display:flex;justify-content:flex-end;padding:0 16px 8px}
.remain-tag{
  font-size:10px;font-weight:600;
  padding:2px 10px;border-radius:20px;
}
.remain-tag.pos{color:var(--green);background:rgba(34,197,94,.08)}
.remain-tag.neg{color:var(--red);background:rgba(239,68,68,.08)}
.remain-tag.zero{color:var(--t4);background:var(--ink3)}

/* Add item row */
.add-row-btn{
  display:flex;align-items:center;gap:7px;
  background:none;border:none;
  color:var(--t4);font-family:'Inter',sans-serif;
  font-size:11px;font-weight:500;
  padding:10px 16px;cursor:pointer;
  width:100%;transition:color .15s;
  border-top:1px solid var(--line2);
}
.add-row-btn:hover{color:var(--t1)}

/* ── OVERLAYS ── */
.ov{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.7);z-index:500;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  align-items:flex-end;justify-content:center;
}
.ov.open{display:flex}
.sheet{
  background:var(--ink2);border:1px solid var(--line);
  border-top-left-radius:24px;border-top-right-radius:24px;
  width:100%;max-width:520px;
  padding-bottom:calc(24px + env(safe-area-inset-bottom));
  animation:sheetup .22s cubic-bezier(.4,0,.2,1);
}
@keyframes sheetup{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
.sheet-handle{width:36px;height:4px;background:var(--line);border-radius:2px;margin:14px auto 0}
.sheet-title{
  font-family:'Syne',sans-serif;font-size:22px;font-weight:700;
  color:var(--t1);padding:18px 24px 14px;
  border-bottom:1px solid var(--line2);
}
.sheet-body{padding:20px 24px 0}
.sheet-foot{padding:16px 24px 0}

.field{margin-bottom:16px}
.field label{
  display:block;font-size:9px;font-weight:700;
  letter-spacing:1.2px;text-transform:uppercase;
  color:var(--t3);margin-bottom:7px;
}
.field input,.field select{
  width:100%;background:var(--ink3);
  border:1px solid var(--line);border-radius:var(--rxs);
  color:var(--t1);font-family:'Inter',sans-serif;
  font-size:14px;padding:11px 13px;outline:none;
  transition:border-color .15s;
  -webkit-appearance:none;appearance:none;
}
.field input:focus,.field select:focus{border-color:var(--t3)}
.field select option{background:var(--ink2)}
.field-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.month-picker-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px}
.mo-item{
  background:var(--ink3);border:1px solid var(--line);
  border-radius:var(--rsm);padding:12px 6px;
  text-align:center;cursor:pointer;
  transition:all .15s;position:relative;
}
.mo-item:hover{border-color:var(--t4);color:var(--t1)}
.mo-item.active{background:var(--t1);border-color:var(--t1);color:var(--ink)}
.mo-item .mo-name{font-size:12px;font-weight:500;color:var(--t2)}
.mo-item.active .mo-name{color:var(--ink);font-weight:600}
.mo-item.has::after{content:'';position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--t4)}
.mo-item.active.has::after{background:rgba(0,0,0,.3)}
.yr-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.yr-lbl{font-family:'Syne',sans-serif;font-size:22px;font-weight:700;color:var(--t1)}
.yr-btn{
  background:var(--ink3);border:1px solid var(--line);
  border-radius:8px;width:34px;height:34px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:16px;color:var(--t2);transition:all .15s;
}
.yr-btn:hover{border-color:var(--t4);color:var(--t1)}

.dup-opt{
  display:flex;align-items:flex-start;gap:13px;
  padding:13px;border:1px solid var(--line);
  border-radius:var(--rsm);cursor:pointer;
  transition:all .15s;margin-bottom:8px;
}
.dup-opt:hover{border-color:var(--t4)}
.dup-opt.sel{border-color:var(--t1)}
.dup-radio{
  width:17px;height:17px;border:2px solid var(--t4);
  border-radius:50%;flex-shrink:0;margin-top:2px;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.dup-opt.sel .dup-radio{border-color:var(--t1);background:var(--t1)}
.dup-dot{width:5px;height:5px;border-radius:50%;background:var(--ink);display:none}
.dup-opt.sel .dup-dot{display:block}
.dup-title{font-size:13px;font-weight:500;color:var(--t1);margin-bottom:2px}
.dup-sub{font-size:11px;color:var(--t3)}

.primary-btn{
  width:100%;padding:14px;
  background:var(--t1);color:var(--ink);
  border:none;border-radius:var(--rsm);
  font-family:'Syne',sans-serif;font-size:14px;font-weight:700;
  cursor:pointer;transition:opacity .15s;letter-spacing:.3px;
}
.primary-btn:hover{opacity:.85}
.primary-btn:active{opacity:.7}

/* ── ANNUAL ── */
.ann-wrap{display:flex;flex-direction:column}
.ann-header{
  display:flex;align-items:flex-end;justify-content:space-between;
  padding:20px 20px 0;
}
.ann-yr{font-family:'Syne',sans-serif;font-size:32px;font-weight:800;color:var(--t1);line-height:1}
.ann-yr-sub{font-size:9px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--t3);margin-bottom:4px}
.ann-nav{display:flex;gap:6px}
.ann-nav-btn{
  background:var(--ink2);border:1px solid var(--line);
  border-radius:8px;font-family:'Inter',sans-serif;
  font-size:11px;font-weight:500;color:var(--t3);
  padding:7px 13px;cursor:pointer;transition:all .15s;
}
.ann-nav-btn:hover{color:var(--t1);border-color:var(--t4)}

/* Annual KPI */
.ann-kpi{
  display:grid;grid-template-columns:1fr 1px 1fr 1px 1fr;
  background:var(--ink2);border-top:1px solid var(--line2);
  border-bottom:1px solid var(--line2);margin-top:16px;
}
.ann-kpi-div{background:var(--line2);margin:10px 0}
.ann-kpi-cell{padding:16px 16px}
.ann-kpi-eye{font-size:9px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--t3);margin-bottom:6px}
.ann-kpi-val{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;line-height:1;color:var(--t1);margin-bottom:3px}
.ann-kpi-val.pos{color:var(--green)}
.ann-kpi-val.neg{color:var(--red)}
.ann-kpi-sub{font-size:10px;color:var(--t3)}

.ann-section{padding:20px 20px 4px}
.ann-section-lbl{font-size:9px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--t3)}

/* Month scroll chips */
.mo-chips{
  display:flex;overflow-x:auto;gap:8px;
  padding:12px 20px 4px;scrollbar-width:none;
}
.mo-chips::-webkit-scrollbar{display:none}
.mo-chip{
  flex-shrink:0;background:var(--ink2);
  border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;min-width:72px;text-align:center;
  cursor:pointer;transition:all .2s;
}
.mo-chip.active{background:var(--t1);border-color:var(--t1)}
.mo-chip-mo{font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--t3);margin-bottom:5px}
.mo-chip.active .mo-chip-mo{color:rgba(0,0,0,.5)}
.mo-chip-val{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:var(--t1);margin-bottom:2px}
.mo-chip.active .mo-chip-val{color:var(--ink)}
.mo-chip-net{font-size:9px;font-weight:600}
.mo-chip.active .mo-chip-net{color:rgba(0,0,0,.4)}

/* Chart containers */
.chart-card{
  background:var(--ink2);border:1px solid var(--line);
  border-radius:var(--r);margin:0 20px;padding:20px 18px 14px;
}
.chart-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.chart-title{font-size:11px;font-weight:600;letter-spacing:.4px;color:var(--t2)}
.chart-meta{font-family:'Syne',sans-serif;font-size:13px;font-weight:600;color:var(--t3)}
.chart-legend{display:flex;gap:12px}
.chart-leg{display:flex;align-items:center;gap:5px;font-size:9px;color:var(--t3)}
.chart-leg-bar{width:12px;height:3px;border-radius:2px}
.chart-mo-labels{display:grid;grid-template-columns:repeat(12,1fr);margin-top:8px}
.chart-mo-label{text-align:center;font-size:8px}

/* Annual category breakdown */
.ann-cat-card{
  background:var(--ink2);border:1px solid var(--line);
  border-radius:var(--r);margin:0 20px;overflow:hidden;
}
.ann-cat-top{display:flex;align-items:center;gap:16px;padding:18px}
.ann-cat-chart{position:relative;flex-shrink:0;width:96px;height:96px}
.ann-cat-list{flex:1;display:flex;flex-direction:column;gap:9px;min-width:0}
.ann-cat-row{display:flex;align-items:center;gap:8px;padding:9px 18px;border-top:1px solid var(--line2)}
.ann-cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ann-cat-name{flex:1;font-size:11px;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ann-cat-track{width:60px;height:3px;background:var(--line);border-radius:2px;overflow:hidden;flex-shrink:0}
.ann-cat-fill{height:100%;border-radius:2px;transition:width .6s}
.ann-cat-pct{font-size:10px;color:var(--t4);min-width:28px;text-align:right}
.ann-cat-amt{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--t1);min-width:50px;text-align:right}

/* Savings rate */
.sav-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:flex-end;height:64px;padding:0 20px}
.sav-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:64px;gap:3px}
.sav-pct{font-size:7px;font-weight:600}
.sav-bar{width:100%;border-radius:2px;transition:height .5s}
.sav-mo{font-size:7px;color:var(--t4)}

/* Annual table */
.ann-table-wrap{overflow-x:auto;padding:0 20px 24px;scrollbar-width:thin;scrollbar-color:var(--line) transparent;margin-top:16px}
.ann-tbl{min-width:860px;width:100%;border-collapse:collapse}
.ann-tbl th{font-size:8px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--t4);padding:8px 10px;text-align:right;border-bottom:2px solid var(--line)}
.ann-tbl th:first-child{text-align:left;min-width:150px}
.ann-tbl td{padding:9px 10px;font-size:11px;text-align:right;border-bottom:1px solid var(--line2);color:var(--t2)}
.ann-tbl td:first-child{text-align:left;color:var(--t1);font-weight:500;white-space:nowrap;font-size:12px}
.ann-tbl tr:hover td{background:var(--ink3)}
.ann-tbl tr.grp-row td{font-size:8px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--t4);padding-top:16px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.ann-tbl tr.sub-row td:first-child{padding-left:16px;color:var(--t2);font-weight:400;font-size:11px}
.ann-tbl tr.tot-row td{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;border-top:2px solid var(--line);background:var(--ink2);color:var(--t1)}
.ann-tbl tr.net-row td{font-family:'Syne',sans-serif;font-size:14px;font-weight:800;background:var(--ink3);border-top:2px solid var(--line)}



/* Toast */
.toast{
  position:fixed;bottom:82px;left:50%;
  transform:translateX(-50%) translateY(10px);
  background:var(--t1);color:var(--ink);
  font-family:'Inter',sans-serif;
  font-size:12px;font-weight:600;
  padding:10px 20px;border-radius:20px;
  opacity:0;transition:all .22s;z-index:999;
  white-space:nowrap;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

function drawDonut(id,slices){
  const el=document.getElementById(id);if(!el)return;
  const dpr=window.devicePixelRatio||1;
  el.width=el.offsetWidth*dpr;el.height=el.offsetHeight*dpr;
  const ctx=el.getContext('2d');ctx.scale(dpr,dpr);
  const W=el.offsetWidth,H=el.offsetHeight,cx=W/2,cy=H/2;
  const OR=Math.min(W,H)/2-2,IR=OR*.62;
  const total=slices.reduce((a,v)=>a+v,0);if(!total)return;
  let a=-Math.PI/2;
  slices.forEach((v,i)=>{
    const sw=(v/total)*2*Math.PI;
    ctx.beginPath();ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,OR,a,a+sw);ctx.closePath();
    ctx.fillStyle=CP[i%CP.length];ctx.fill();
    a+=sw;
  });
  ctx.beginPath();ctx.arc(cx,cy,IR,0,2*Math.PI);
  ctx.fillStyle='#0F0F0F';ctx.fill();
}
function drawGrouped(id,inc,exp){
  const el=document.getElementById(id);if(!el)return;
  const dpr=window.devicePixelRatio||1;
  el.width=el.offsetWidth*dpr;el.height=el.offsetHeight*dpr;
  const ctx=el.getContext('2d');ctx.scale(dpr,dpr);
  const W=el.offsetWidth,H=el.offsetHeight;
  ctx.clearRect(0,0,W,H);
  const n=inc.length,mx=Math.max(...inc,...exp,1);
  const pB=18,pT=6,slot=W/n,bw=Math.max(2,(slot-6)/2);
  inc.forEach((iv,i)=>{
    const ev=exp[i],x=i*slot+2;
    const iH=(iv/mx)*(H-pT-pB);
    const eH=(ev/mx)*(H-pT-pB);
    if(iv>0){ctx.fillStyle='rgba(244,244,244,.5)';ctx.beginPath();ctx.roundRect(x,H-pB-iH,bw,iH,2);ctx.fill();}
    if(ev>0){ctx.fillStyle=ev>iv?'rgba(239,68,68,.6)':'rgba(244,244,244,.2)';ctx.beginPath();ctx.roundRect(x+bw+2,H-pB-eH,bw,eH,2);ctx.fill();}
    ctx.fillStyle='rgba(244,244,244,.18)';
    ctx.font=`${Math.max(7,slot*.28)}px Inter,sans-serif`;
    ctx.textAlign='center';
    ctx.fillText(MO[i][0],x+slot/2-1,H-4);
  });
}
function drawLine(id,pts){
  const el=document.getElementById(id);if(!el)return;
  const dpr=window.devicePixelRatio||1;
  el.width=el.offsetWidth*dpr;el.height=el.offsetHeight*dpr;
  const ctx=el.getContext('2d');ctx.scale(dpr,dpr);
  const W=el.offsetWidth,H=el.offsetHeight;
  ctx.clearRect(0,0,W,H);
  if(pts.filter(v=>v!==0).length<2)return;
  const mx=Math.max(...pts),mn=Math.min(...pts,0),range=(mx-mn)||1,pad=10;
  const xs=pts.map((_,i)=>pad+(i/(pts.length-1))*(W-pad*2));
  const ys=pts.map(p=>H-pad-((p-mn)/range)*(H-pad*2));
  ctx.beginPath();ctx.moveTo(xs[0],H-pad);
  xs.forEach((x,i)=>ctx.lineTo(x,ys[i]));
  ctx.lineTo(xs[xs.length-1],H-pad);ctx.closePath();
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'rgba(244,244,244,.08)');g.addColorStop(1,'rgba(244,244,244,0)');
  ctx.fillStyle=g;ctx.fill();
  ctx.beginPath();ctx.moveTo(xs[0],ys[0]);
  xs.forEach((x,i)=>ctx.lineTo(x,ys[i]));
  ctx.strokeStyle='rgba(244,244,244,.6)';ctx.lineWidth=1.5;ctx.lineJoin='round';ctx.stroke();
  pts.forEach((p,i)=>{
    if(p===0)return;
    ctx.beginPath();ctx.arc(xs[i],ys[i],2.5,0,2*Math.PI);
    ctx.fillStyle=p>=0?'var(--green)':'var(--red)';ctx.fill();
  });
}

      const addBtn=document.createElement('button');
      addBtn.className='add-row-btn';
      addBtn.innerHTML=`<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><line x1="6" y1="1" x2="6" y2="11"/><line x1="1" y1="6" x2="11" y2="6"/></svg> Add item`;
      addBtn.onclick=()=>openAddItem(sec.key);
      gc.appendChild(addBtn);
    });

    cont.appendChild(gc);
  });
}

function upd(sk,i,f,v){
  const sec=findSec(getGroups(),sk);
  if(sec)sec.rows[i][f]=parseFloat(v)||0;
  rGrpTotals();
  saveData();
}

function rGrpTotals(){
  const iB=totalInc(),eB=totalExp(),net=iB-eB;
  getGroups().forEach(grp=>{
    const gb=grpBud(grp),ga=grpAct(grp),gr=gb-ga;
    const b=document.getElementById('gsb-'+grp.key);
    const a=document.getElementById('gsa-'+grp.key);
    const r=document.getElementById('gsr-'+grp.key);
    if(b)b.textContent=gb?fmt(gb):'—';
    if(a)a.textContent=ga?fmt(ga):'—';
    if(r){r.textContent=(gb||ga)?fmt(gr):'—';r.className='grp-stat-val'+(gr<0?' neg':gr>0?' pos':'');}
  });
  // Update strip
  const cells=document.querySelectorAll('.bvs-val');
  if(cells[0])cells[0].textContent=fmtk(iB);
  if(cells[1]){cells[1].textContent=fmtk(eB);cells[1].className='bvs-val'+(eB>iB?' neg':'');}
  if(cells[2]){cells[2].textContent=(net>=0?'+':'')+fmtk(net);cells[2].className='bvs-val'+(net>0?' pos':net<0?' neg':'');}
}

function delRow(sk,i){
  const sec=findSec(getGroups(),sk);
  if(!sec)return;
  sec.rows.splice(i,1);
  rBudget();saveData();toast('Item removed');
}

// ── ANNUAL ────────────────────────────────────────────────────────────────────
function rAnnual(){
  const mos=MO.map(m=>m.slice(0,3));
  const groups=getGroups();
  const annInc=Array.from({length:12},(_,mi)=>{
    const k=mk(curYr,mi);
    if(mi===curMo&&k===curKey()){const ig=getGroups().find(g=>g.key==='income');return ig?grpBud(ig):0;}
    const dg=DATA[k]?.groups||[];const ig=dg.find(g=>g.key==='income');return ig?grpBud(ig):0;
  });
  const annExp=Array.from({length:12},(_,mi)=>{
    const k=mk(curYr,mi);
    if(mi===curMo&&k===curKey()) return getGroups().filter(g=>g.key!=='income').reduce((a,g)=>a+grpBud(g),0);
    const dg=DATA[k]?.groups||[];return dg.filter(g=>g.key!=='income').reduce((a,g)=>a+grpBud(g),0);
  });
  const annNet=annInc.map((v,i)=>v-annExp[i]);
  const hasAnn=annInc.some(v=>v>0)||annExp.some(v=>v>0);
  const yrInc=annInc.reduce((a,v)=>a+v,0);
  const yrExp=annExp.reduce((a,v)=>a+v,0);
  const yrNet=yrInc-yrExp;
  const activeM=annNet.filter((_,i)=>annInc[i]||annExp[i]).length;
  const posM=annNet.filter((v,i)=>(annInc[i]||annExp[i])&&v>=0).length;
  const grpTotals=groups.filter(g=>g.key!=='income').map(g=>{
    const tot=Array.from({length:12},(_,mi)=>{
      const k=mk(curYr,mi);
      const srcG=(mi===curMo&&k===curKey())?getGroups():(DATA[k]?.groups||[]);
      const mg=srcG.find(x=>x.key===g.key);return mg?grpBud(mg):0;
    }).reduce((a,v)=>a+v,0);
    return {label:g.label,tot};
  }).filter(g=>g.tot>0).sort((a,b)=>b.tot-a.tot);
  const totalYrExp=grpTotals.reduce((a,g)=>a+g.tot,0);

  document.getElementById('annC').innerHTML=`
    <div class="ann-header">
      <div>
        <div class="ann-yr-sub">Annual Overview</div>
        <div class="ann-yr">${curYr}</div>
      </div>
      <div class="ann-nav">
        <button class="ann-nav-btn" onclick="chAnnYr(-1)">&#8249; ${curYr-1}</button>
        <button class="ann-nav-btn" onclick="chAnnYr(1)">${curYr+1} &#8250;</button>
      </div>
    </div>

    <div class="ann-kpi">
      <div class="ann-kpi-cell">
        <div class="ann-kpi-eye">Income</div>
        <div class="ann-kpi-val">${fmtk(yrInc)}</div>
        <div class="ann-kpi-sub">${activeM} month${activeM!==1?'s':''}</div>
      </div>
      <div class="ann-kpi-div"></div>
      <div class="ann-kpi-cell">
        <div class="ann-kpi-eye">Expenses</div>
        <div class="ann-kpi-val ${yrExp>yrInc?'neg':''}">${fmtk(yrExp)}</div>
        <div class="ann-kpi-sub">${yrInc>0?Math.round(yrExp/yrInc*100)+'% of income':'—'}</div>
      </div>
      <div class="ann-kpi-div"></div>
      <div class="ann-kpi-cell">
        <div class="ann-kpi-eye">Net</div>
        <div class="ann-kpi-val ${yrNet>=0?'pos':'neg'}">${yrNet>=0?'+':''}${fmtk(Math.abs(yrNet))}</div>
        <div class="ann-kpi-sub">${posM}/${activeM} months +</div>
      </div>
    </div>

    ${!hasAnn?`
    <div class="empty-state">
      <div class="empty-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      </div>
      <div class="empty-text">No data for ${curYr}.<br>Enter budget amounts to see the annual view.</div>
    </div>`:`

    <div class="ann-section"><div class="ann-section-lbl">By Month</div></div>
    <div class="mo-chips">
      ${annInc.map((inc,i)=>{
        const exp=annExp[i],net=inc-exp,has=inc||exp;
        return `<div class="mo-chip${i===curMo?' active':''}" onclick="selMo(${i})">
          <div class="mo-chip-mo">${mos[i]}</div>
          <div class="mo-chip-val">${has?fmtk(inc):'—'}</div>
          <div class="mo-chip-net" style="color:${!has?'transparent':net>=0?'var(--green)':'var(--red)'}">
            ${has?(net>=0?'+':'')+(Math.abs(net)>=1000?'$'+(Math.abs(net)/1000).toFixed(1)+'k':'$'+Math.abs(Math.round(net))):''}
          </div>
        </div>`;
      }).join('')}
    </div>

    <div class="ann-section"><div class="ann-section-lbl" style="margin-bottom:12px">Monthly Comparison</div></div>
    <div class="chart-card" style="margin-bottom:12px">
      <div class="chart-head">
        <div class="chart-title">Income vs Expenses</div>
        <div class="chart-legend">
          <div class="chart-leg"><div class="chart-leg-bar" style="background:rgba(244,244,244,.5)"></div>Income</div>
          <div class="chart-leg"><div class="chart-leg-bar" style="background:rgba(244,244,244,.2)"></div>Expenses</div>
        </div>
      </div>
      <canvas id="annBars" style="width:100%;height:120px;display:block"></canvas>
      <div class="chart-mo-labels" style="margin-top:8px">
        ${mos.map((m,i)=>`<div style="text-align:center;font-size:8px;color:${i===curMo?'var(--t1)':'var(--t4)'};font-weight:${i===curMo?700:400}">${m}</div>`).join('')}
      </div>
    </div>

    <div class="chart-card" style="margin-bottom:12px">
      <div class="chart-head">
        <div class="chart-title">Net per Month</div>
        <div class="chart-meta" style="color:${yrNet>=0?'var(--green)':'var(--red)'}">${yrNet>=0?'+':''}${fmtk(Math.abs(yrNet))} ytd</div>
      </div>
      <canvas id="annLine" style="width:100%;height:80px;display:block"></canvas>
      <div class="chart-mo-labels" style="margin-top:6px">
        ${annNet.map((v,i)=>{
          const has=annInc[i]||annExp[i];
          return `<div style="text-align:center;font-size:7px;font-weight:600;color:${!has?'transparent':v>=0?'var(--green)':'var(--red)'}">
            ${has?(Math.abs(v)>=1000?(v>=0?'+':'-')+'$'+(Math.abs(v)/1000).toFixed(1)+'k':(v>=0?'+':'-')+'$'+Math.abs(Math.round(v))):''}
          </div>`;
        }).join('')}
      </div>
    </div>

    ${yrInc>0?`
    <div class="ann-section"><div class="ann-section-lbl" style="margin-bottom:12px">Savings Rate</div></div>
    <div class="sav-grid">
      ${annInc.map((inc,i)=>{
        const exp=annExp[i],has=inc||exp;
        const rate=inc>0?Math.max(0,Math.round((inc-exp)/inc*100)):0;
        const barH=has?Math.max(4,Math.round(rate*.55)):0;
        const col=rate>=20?'var(--green)':rate>=10?'var(--amber)':'var(--red)';
        return `<div class="sav-col">
          <div class="sav-pct" style="color:${!has?'transparent':col}">${has?rate+'%':''}</div>
          <div class="sav-bar" style="height:${barH}px;background:${has?col:'transparent'}"></div>
          <div class="sav-mo" style="color:${i===curMo?'var(--t1)':'var(--t4)'}">${MO[i].slice(0,1)}</div>
        </div>`;
      }).join('')}
    </div>`:''}

    ${grpTotals.length?`
    <div class="ann-section" style="margin-top:16px"><div class="ann-section-lbl">Annual Spending</div></div>
    <div class="ann-cat-card" style="margin:12px 20px">
      <div class="ann-cat-top">
        <div class="ann-cat-chart">
          <canvas id="annDnut" style="width:96px;height:96px;display:block"></canvas>
          <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none">
            <div style="font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--t1)">${fmtk(totalYrExp)}</div>
            <div style="font-size:7px;color:var(--t3);text-transform:uppercase;letter-spacing:.5px">total</div>
          </div>
        </div>
        <div class="ann-cat-list">
          ${grpTotals.slice(0,5).map((g,i)=>{
            const pct=totalYrExp>0?Math.round(g.tot/totalYrExp*100):0;
            return `<div>
              <div style="display:flex;justify-content:space-between;margin-bottom:3px">
                <div style="display:flex;align-items:center;gap:5px">
                  <div style="width:6px;height:6px;border-radius:50%;background:${CP[i%CP.length]};flex-shrink:0"></div>
                  <span style="font-size:10px;color:var(--t2)">${g.label}</span>
                </div>
                <div style="display:flex;gap:6px;align-items:center">
                  <span style="font-size:9px;color:var(--t4)">${pct}%</span>
                  <span style="font-family:'Syne',sans-serif;font-size:12px;font-weight:700;color:var(--t1)">${fmtk(g.tot)}</span>
                </div>
              </div>
              <div style="height:2px;background:var(--line);border-radius:1px;overflow:hidden">
                <div style="height:100%;background:${CP[i%CP.length]};width:${pct}%;transition:width .6s"></div>
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>
      ${grpTotals.slice(5).map((g,i)=>{
        const pct=totalYrExp>0?Math.round(g.tot/totalYrExp*100):0;
        return `<div class="ann-cat-row">
          <div class="ann-cat-dot" style="background:${CP[(i+5)%CP.length]}"></div>
          <div class="ann-cat-name">${g.label}</div>
          <div class="ann-cat-track"><div class="ann-cat-fill" style="width:${pct}%;background:${CP[(i+5)%CP.length]}"></div></div>
          <div class="ann-cat-pct">${pct}%</div>
          <div class="ann-cat-amt">${fmtk(g.tot)}</div>
        </div>`;
      }).join('')}
    </div>`:''}

    <div class="ann-section" style="margin-top:16px"><div class="ann-section-lbl">Full Year Detail</div></div>
    <div class="ann-table-wrap">
      <table class="ann-tbl">
        <thead><tr><th>Category</th>${mos.map((m,i)=>`<th style="opacity:${annInc[i]||annExp[i]?1:.25};${i===curMo?'color:var(--t1)':''}">${m}</th>`).join('')}<th style="color:var(--t1)">Total</th></tr></thead>
        <tbody>${(()=>{
          let rows='';
          groups.forEach(grp=>{
            rows+=`<tr class="grp-row"><td colspan="14">${grp.label}</td></tr>`;
            grp.secs.forEach(sec=>{
              rows+=`<tr class="sub-row"><td>${sec.label}</td>`;
              let yr=0;
              mos.forEach((_,mi)=>{
                const k=mk(curYr,mi);
                const srcG=(mi===curMo&&k===curKey())?getGroups():(DATA[k]?.groups||[]);
                const dg=srcG.find(g=>g.key===grp.key);
                const ds=dg?.secs?.find(s=>s.key===sec.key);
                const v=ds?secBud(ds):0;yr+=v;
                rows+=`<td style="${mi===curMo?'color:var(--t1)':''}">${v?'$'+Math.round(v).toLocaleString():'—'}</td>`;
              });
              rows+=`<td style="font-weight:700;color:var(--t1)">${yr?'$'+Math.round(yr).toLocaleString():'—'}</td></tr>`;
            });
          });
          let gi=0;rows+='<tr class="tot-row"><td>Total Income</td>';
          mos.forEach((_,mi)=>{
            const k=mk(curYr,mi);const dg=(mi===curMo&&k===curKey())?getGroups():(DATA[k]?.groups||[]);
            const ig=dg.find(g=>g.key==='income');const v=ig?grpBud(ig):0;gi+=v;
            rows+=`<td style="${mi===curMo?'color:var(--t1)':''}">${v?'$'+Math.round(v).toLocaleString():'—'}</td>`;
          });
          rows+=`<td>${gi?'$'+Math.round(gi).toLocaleString():'—'}</td></tr>`;
          let gt=0;rows+='<tr class="tot-row"><td>Total Expenses</td>';
          mos.forEach((_,mi)=>{
            const k=mk(curYr,mi);const dg=(mi===curMo&&k===curKey())?getGroups():(DATA[k]?.groups||[]);
            const t=dg.filter(g=>g.key!=='income').reduce((a,g)=>a+grpBud(g),0);gt+=t;
            rows+=`<td style="${mi===curMo?'color:var(--t1)':''}">${t?'$'+Math.round(t).toLocaleString():'—'}</td>`;
          });
          rows+=`<td>${gt?'$'+Math.round(gt).toLocaleString():'—'}</td></tr>`;
          let gn=0;rows+='<tr class="net-row"><td>Net</td>';
          mos.forEach((_,mi)=>{
            const k=mk(curYr,mi);const dg=(mi===curMo&&k===curKey())?getGroups():(DATA[k]?.groups||[]);
            const iT=dg.find(g=>g.key==='income')?grpBud(dg.find(g=>g.key==='income')):0;
            const eT=dg.filter(g=>g.key!=='income').reduce((a,g)=>a+grpBud(g),0);
            const n=iT-eT;gn+=n;
            rows+=`<td style="color:${(iT||eT)?(n>=0?'var(--green)':'var(--red)'):'inherit'}">${(iT||eT)?'$'+Math.round(n).toLocaleString():'—'}</td>`;
          });
          rows+=`<td style="color:${gn>=0?'var(--green)':'var(--red)'}">${gn?'$'+Math.round(gn).toLocaleString():'—'}</td></tr>`;
          return rows;
        })()}</tbody>
      </table>
    </div>
    `}
  `;
  requestAnimationFrame(()=>{
    if(hasAnn){
      drawGrouped('annBars',annInc,annExp);
      drawLine('annLine',annNet);
      if(grpTotals.length) drawDonut('annDnut',grpTotals.map(g=>g.tot));
    }
  });
}
function chAnnYr(d){curYr+=d;updLabel();rAnnual()}

// ── MONTH PICKER ──────────────────────────────────────────────────────────────
function openMoPicker(){picYr=curYr;rMoGrid();OO('ovMo')}
function rMoGrid(){
  document.getElementById('picYrLbl').textContent=picYr;
  document.getElementById('moPicGrid').innerHTML=MO.map((n,i)=>{
    const k=mk(picYr,i),has=!!DATA[k],active=i===curMo&&picYr===curYr;
    return `<div class="mo-item${active?' active':''}${has?' has':''}" onclick="selMo(${i})">
      <div class="mo-name">${n.slice(0,3)}</div>
    </div>`;
  }).join('');
}
function chPicYr(d){picYr+=d;rMoGrid()}
function selMo(m){
  curMo=m;curYr=picYr;updLabel();CO(null,'ovMo');
  const av=['dash','budget','annual'].find(v=>document.getElementById('view-'+v).classList.contains('active'));
  sv(av||'dash');toast(`${MO[m]} ${curYr}`);
}

// ── DUPLICATE ─────────────────────────────────────────────────────────────────
function openDup(){let nm=curMo+1,ny=curYr;if(nm>11){nm=0;ny++;}document.getElementById('dupMo').value=nm;document.getElementById('dupYr').value=ny;OO('ovDup')}
function selDop(n){dopSel=n;document.getElementById('dop1').classList.toggle('sel',n===1);document.getElementById('dop2').classList.toggle('sel',n===2)}
function execDup(){
  const tm=parseInt(document.getElementById('dupMo').value);
  const ty=parseInt(document.getElementById('dupYr').value);
  const deep=JSON.parse(JSON.stringify(getGroups()));
  if(dopSel===1)deep.forEach(g=>g.secs.forEach(s=>s.rows.forEach(r=>r.a=0)));
  DATA[mk(ty,tm)]={groups:deep};
  saveData();CO(null,'ovDup');curMo=tm;curYr=ty;updLabel();sv('budget');toast(`Duplicated to ${MO[tm]} ${ty}`);
}

// ── ADD ITEM ──────────────────────────────────────────────────────────────────
function openAddItem(k){
  addItemForSec=k;
  const secs=allSecs(getGroups());
  document.getElementById('niCat').innerHTML=secs.map(s=>`<option value="${s.key}"${s.key===k?' selected':''}>${s.label}</option>`).join('');
  document.getElementById('niName').value='';document.getElementById('niBud').value='';document.getElementById('niAct').value='';
  OO('ovAddItem');
}
function addItem(){
  const name=document.getElementById('niName').value.trim();if(!name)return;
  const sk=document.getElementById('niCat').value;
  const b=parseFloat(document.getElementById('niBud').value)||0;
  const a=parseFloat(document.getElementById('niAct').value)||0;
  const sec=findSec(getGroups(),sk);
  if(sec)sec.rows.push({n:name,b,a});
  saveData();CO(null,'ovAddItem');rBudget();toast('Item added');
}

// ── OVERLAYS ──────────────────────────────────────────────────────────────────
function OO(id){document.getElementById(id).classList.add('open')}
function CO(e,id){if(!e||e.target===document.getElementById(id))document.getElementById(id).classList.remove('open')}

// ── PERSIST ───────────────────────────────────────────────────────────────────
function saveData(){try{localStorage.setItem('lunlo_data',JSON.stringify(DATA));}catch(e){}}
(function loadData(){try{const s=localStorage.getItem('lunlo_data');if(s)Object.assign(DATA,JSON.parse(s));}catch(e){}})();

// ── SERVICE WORKER ────────────────────────────────────────────────────────────
if('serviceWorker' in navigator){
  const c=`const CA='lunlo-v2';self.addEventListener('install',e=>{self.skipWaiting()});self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CA).map(k=>caches.delete(k)))).then(()=>clients.claim()))});self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(res=>{const c2=res.clone();caches.open(CA).then(c=>c.put(e.request,c2));return res}).catch(()=>caches.match(e.request))))})`;
  const b=new Blob([c],{type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(b)).catch(()=>{});
}

// ── INIT ──────────────────────────────────────────────────────────────────────
getGroups();updLabel();rDash();

</script>
</body>
</html>
