<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lunlo">
<meta name="theme-color" content="#0A0A0A">
<title>Lunlo - Budget Wisely. Grow More.</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --white:#FFFFFF;--bg:#0A0A0A;--s1:#1A1A1A;--s2:#242424;--s3:#2E2E2E;--line:#3A3A3A;--line2:#262626;
  --t1:#FFFFFF;--t2:#E8E8E8;--t3:#B0B0B0;--t4:#808080;--t5:#5A5A5A;
  --green:#34D399;--green-bg:#064E3B;--red:#F87171;--red-bg:#7F1D1D;--amber:#FCD34D;--amber-bg:#78350F;
  --r:12px;--rsm:10px;--rxs:6px;--sh:0 2px 8px rgba(0,0,0,.4);--sh2:0 4px 12px rgba(0,0,0,.5);--sh3:0 8px 20px rgba(0,0,0,.6)
}
html,body{height:100%;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{background:var(--bg);color:var(--t1);font-family:'Plus Jakarta Sans',sans-serif;font-weight:400;font-size:15px;padding-bottom:80px;overflow-x:hidden;min-height:100vh}

/* TOPBAR */
.topbar{position:sticky;top:0;z-index:300;background:rgba(10,10,10,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--line);height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.topbar-logo{height:40px;width:auto}
.topbar-right{display:flex;align-items:center;gap:8px}
.mo-chip{display:flex;align-items:center;gap:6px;background:var(--s2);border:1px solid var(--line);border-radius:18px;padding:7px 14px;cursor:pointer;font-size:13px;font-weight:600;color:var(--t2);transition:all .2s}
.mo-chip:hover{background:var(--s3);border-color:var(--t5)}
.mo-chip svg{width:9px;height:9px;opacity:.4}
.ico{width:36px;height:36px;border-radius:50%;background:var(--s2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t3);transition:all .2s;box-shadow:var(--sh)}
.ico:hover{background:var(--s3);color:var(--t1)}

/* VIEWS */
.view{display:none;flex-direction:column;animation:fade-in .2s}
.view.active{display:flex}
@keyframes fade-in{from{opacity:0}to{opacity:1}}

/* BOTTOM NAV */
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:300;background:rgba(10,10,10,.95);backdrop-filter:blur(20px);border-top:1px solid var(--line);display:flex;padding:0 0 calc(env(safe-area-inset-bottom));box-shadow:0 -2px 8px rgba(0,0,0,.4)}
.nbtn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:none;border:none;font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--t4);cursor:pointer;transition:color .2s;padding:12px 0 14px}
.nbtn.active{color:var(--t1)}
.nbtn svg{width:20px;height:20px;stroke-width:1.5}

/* DASHBOARD */
.dash{padding:16px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.card-title{font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--t4);margin-bottom:12px}
.hero{background:linear-gradient(135deg, #1A1A1A 0%, #2A2A2A 100%);border-radius:var(--r);padding:24px;position:relative;overflow:hidden;box-shadow:var(--sh2)}
.hero::after{content:'';position:absolute;top:-50px;right:-50px;width:150px;height:150px;border-radius:50%;background:rgba(52,211,153,.05);pointer-events:none}
.hero-label{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--t4);margin-bottom:8px}
.hero-amount{font-family:'DM Serif Display',serif;font-size:48px;letter-spacing:-1px;line-height:1;color:var(--t1);margin-bottom:4px}
.hero-amount.neg{color:#F87171}
.hero-sub{font-size:12px;color:var(--t3);margin-bottom:16px}
.hero-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.hstat{text-align:center}
.hstat-v{font-family:'DM Serif Display',serif;font-size:20px;color:var(--t1);margin-bottom:3px}
.hstat-v.pos{color:#34D399}
.hstat-v.neg{color:#F87171}
.hstat-l{font-size:9px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--t4)}

/* EMPTY STATE */
.empty-state{text-align:center;padding:40px 24px}
.empty-icon{width:48px;height:48px;border:2px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:var(--t4)}
.empty-title{font-size:16px;font-weight:700;color:var(--t1);margin-bottom:6px}
.empty-sub{font-size:13px;color:var(--t3);line-height:1.5}

/* TOAST */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--t1);color:#000;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:700;padding:12px 20px;border-radius:20px;opacity:0;transition:all .25s;z-index:999;white-space:nowrap;pointer-events:none;box-shadow:var(--sh3)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* BUDGET VIEW */
.bv-top{padding:16px 16px 0;display:flex;align-items:center;justify-content:space-between}
.bv-month{font-family:'DM Serif Display',serif;font-size:28px;color:var(--t1)}
.add-btn{display:flex;align-items:center;gap:6px;background:var(--t1);color:#000;border:none;border-radius:18px;font-size:12px;font-weight:700;padding:10px 16px;cursor:pointer;box-shadow:var(--sh2);transition:all .2s}
.add-btn:hover{transform:translateY(-1px);box-shadow:var(--sh3)}
.add-btn svg{width:12px;height:12px;stroke-width:2.5}

.bv-strip{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:16px}
.bvs{background:var(--s1);padding:12px 14px;text-align:center}
.bvs-eye{font-size:9px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--t4);margin-bottom:4px}
.bvs-val{font-family:'DM Serif Display',serif;font-size:20px;color:var(--t1)}
.bvs-val.pos{color:#34D399}
.bvs-val.neg{color:#F87171}

.bv-groups{padding:16px;display:flex;flex-direction:column;gap:12px}
.bv-group{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}

.grp-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line2)}
.grp-head-left{display:flex;align-items:center;gap:10px}
.grp-name{font-size:14px;font-weight:700;color:var(--t1)}
.grp-badge{background:var(--s2);border:1px solid var(--line);border-radius:5px;font-size:10px;font-weight:700;color:var(--t4);padding:2px 7px}
.grp-stats{display:flex;align-items:center;gap:14px}
.grp-stat{text-align:right}
.grp-stat-lbl{font-size:8px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--t4);margin-bottom:2px}
.grp-stat-val{font-family:'DM Serif Display',serif;font-size:15px;color:var(--t1)}
.grp-stat-val.pos{color:#34D399}
.grp-stat-val.neg{color:#F87171}

.col-row{display:grid;grid-template-columns:1fr 80px 80px;gap:8px;padding:8px 16px;background:var(--s2);border-bottom:1px solid var(--line2);font-size:9px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--t4)}
.col-row > :first-child{text-align:left}
.col-row > :not(:first-child){text-align:right}

.bv-row{display:grid;grid-template-columns:1fr 80px 80px;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line2);align-items:center}
.bv-row:hover{background:var(--s2)}
.row-name{font-size:13px;font-weight:500;color:var(--t1);position:relative}
.del-btn{position:absolute;right:0;top:50%;transform:translateY(-50%);background:none;border:none;color:#F87171;opacity:0;font-size:14px;cursor:pointer;padding:4px;transition:opacity .15s}
.bv-row:hover .del-btn{opacity:.6}
.del-btn:hover{opacity:1}

.inp-wrap{position:relative}
.inp-sym{position:absolute;left:0;top:50%;transform:translateY(-50%);font-size:11px;color:var(--t5);pointer-events:none}
.num-inp{width:100%;background:transparent;border:none;border-bottom:1.5px solid var(--line);color:var(--t1);font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:700;padding:4px 0 4px 14px;outline:none;text-align:right;transition:border-color .15s}
.num-inp:focus{border-bottom-color:var(--t1)}
.num-inp::placeholder{color:var(--t5)}

.add-row-btn{display:flex;align-items:center;gap:6px;width:100%;background:none;border:none;border-top:1px solid var(--line2);color:var(--t4);font-size:12px;font-weight:600;padding:10px 16px;cursor:pointer;transition:color .15s}
.add-row-btn:hover{color:var(--t1)}
.add-row-btn svg{width:12px;height:12px;stroke-width:2.5}

/* OVERLAYS */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;backdrop-filter:blur(4px);align-items:flex-end;justify-content:center}
.ov.open{display:flex}
.sheet{background:var(--s1);border-top-left-radius:20px;border-top-right-radius:20px;border:1px solid var(--line);border-bottom:none;width:100%;max-width:100%;padding-bottom:calc(20px + env(safe-area-inset-bottom));animation:slide-up .25s cubic-bezier(.4,0,.2,1);box-shadow:var(--sh3)}
@keyframes slide-up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sh-handle{width:32px;height:4px;background:var(--s3);border-radius:2px;margin:12px auto 0}
.sh-title{font-family:'DM Serif Display',serif;font-size:22px;color:var(--t1);padding:16px 20px 12px;border-bottom:1px solid var(--line2)}
.sh-body{padding:18px 20px 0}
.sh-foot{padding:14px 20px 0}

.field{margin-bottom:14px}
.field label{display:block;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--t3);margin-bottom:6px}
.field input,.field select{width:100%;background:var(--s2);border:1px solid var(--line);border-radius:var(--rxs);color:var(--t1);font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:500;padding:10px 12px;outline:none;transition:all .2s;-webkit-appearance:none;appearance:none}
.field input:focus,.field select:focus{border-color:var(--t1);background:var(--s3)}
.field-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.yr-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.yr-lbl{font-family:'DM Serif Display',serif;font-size:22px;color:var(--t1)}
.yr-btn{background:var(--s2);border:1px solid var(--line);border-radius:8px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;color:var(--t2);transition:all .2s}
.yr-btn:hover{background:var(--s3);color:var(--t1)}

.mo-pick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mo-pick-item{background:var(--s2);border:1px solid var(--line);border-radius:var(--rsm);padding:12px 6px;text-align:center;cursor:pointer;transition:all .15s;position:relative}
.mo-pick-item:hover{border-color:var(--t5);background:var(--s3)}
.mo-pick-item.active{background:var(--t1);border-color:var(--t1)}
.mo-pick-item .mn{font-size:12px;font-weight:700;color:var(--t2)}
.mo-pick-item.active .mn{color:#000}

.dup-opt{display:flex;align-items:flex-start;gap:12px;padding:12px;border:1px solid var(--line);border-radius:var(--rsm);cursor:pointer;transition:all .15s;margin-bottom:10px}
.dup-opt:hover{border-color:var(--t5)}
.dup-opt.sel{border-color:var(--t1);background:var(--s2)}
.dup-radio{width:16px;height:16px;border:2px solid var(--t5);border-radius:50%;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.dup-opt.sel .dup-radio{border-color:var(--t1);background:var(--t1)}
.dup-dot{width:5px;height:5px;border-radius:50%;background:var(--bg);display:none}
.dup-opt.sel .dup-dot{display:block}
.dup-t{font-size:13px;font-weight:700;color:var(--t1);margin-bottom:2px}
.dup-s{font-size:12px;color:var(--t3)}

.primary-btn{width:100%;padding:13px;background:var(--t1);color:#000;border:none;border-radius:var(--rsm);font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;box-shadow:var(--sh2)}
.primary-btn:hover{transform:translateY(-1px);box-shadow:var(--sh3)}
</style>
</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
<img class="topbar-logo" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 40'%3E%3Ctext x='10' y='28' font-family='DM Serif Display' font-size='28' fill='%23FFFFFF' font-weight='bold'%3ELunlo%3C/text%3E%3C/svg%3E" alt="Lunlo">
<div class="topbar-right">
<div class="mo-chip" id="moChip" onclick="openMoPicker()">
<span id="moLabel">March 2026</span>
<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 4l4 4 4-4" stroke-linecap="round"/></svg>
</div>
<button class="ico" onclick="exportExcel()" title="Export to Excel">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4" width="16" height="16" rx="1"/><line x1="4" y1="10" x2="20" y2="10"/><line x1="10" y1="20" x2="10" y2="10"/><line x1="4" y1="14" x2="20" y2="14"/><line x1="14" y1="20" x2="14" y2="10"/></svg>
</button>
<button class="ico" onclick="openDup()" title="Duplicate">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 7V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-2"/><rect x="4" y="9" width="10" height="10" rx="1"/></svg>
</button>
</div>
</header>

<!-- VIEWS -->
<div class="view active" id="view-dash"><div class="dash" id="dashC"></div></div>
<div class="view" id="view-budget">
<div class="bv-top">
<div class="bv-month" id="bvMonth">March 2026</div>
<button class="add-btn" onclick="openAddItem(null)">
<svg viewBox="0 0 12 12" fill="none" stroke="currentColor"><line x1="6" y1="2" x2="6" y2="10"/><line x1="2" y1="6" x2="10" y2="6"/></svg>
Add Item
</button>
</div>
<div class="bv-strip" id="bvStrip"></div>
<div class="bv-groups" id="bvGroups"></div>
</div>

<!-- BOTTOM NAV -->
<nav class="bnav">
<button class="nbtn active" id="navDash" onclick="sv('dash')">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="8" height="8"/><rect x="13" y="3" width="8" height="8"/><rect x="3" y="13" width="8" height="8"/><rect x="13" y="13" width="8" height="8"/></svg>
Dashboard
</button>
<button class="nbtn" id="navBudget" onclick="sv('budget')">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="3" y1="7" x2="21" y2="7"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="17" x2="21" y2="17"/></svg>
Budget
</button>
</nav>

<div class="toast" id="toast"></div>

<!-- MONTH PICKER -->
<div class="ov" id="ovMo" onclick="closeOverlay(event,'ovMo')">
<div class="sheet">
<div class="sh-handle"></div>
<div class="sh-title">Choose Month</div>
<div class="sh-body">
<div class="yr-nav">
<button class="yr-btn" onclick="chPicYr(-1)">‹</button>
<div class="yr-lbl" id="picYrLbl">2026</div>
<button class="yr-btn" onclick="chPicYr(1)">›</button>
</div>
<div class="mo-pick-grid" id="moPicGrid"></div>
</div>
</div>
</div>

<!-- DUPLICATE -->
<div class="ov" id="ovDup" onclick="closeOverlay(event,'ovDup')">
<div class="sheet">
<div class="sh-handle"></div>
<div class="sh-title">Duplicate Budget</div>
<div class="sh-body">
<div class="field"><label>Copy to month</label>
<select id="dupMo"><option value="0">January</option><option value="1">February</option><option value="2">March</option><option value="3">April</option><option value="4">May</option><option value="5">June</option><option value="6">July</option><option value="7">August</option><option value="8">September</option><option value="9">October</option><option value="10">November</option><option value="11">December</option></select>
</div>
<div class="field"><label>Year</label><input type="number" id="dupYr" value="2026" min="2020" max="2040"></div>
<div class="dup-opt sel" id="dop1" onclick="selDop(1)">
<div class="dup-radio"><div class="dup-dot"></div></div>
<div><div class="dup-t">Template only</div><div class="dup-s">Copy budgets, reset actuals to $0</div></div>
</div>
<div class="dup-opt" id="dop2" onclick="selDop(2)">
<div class="dup-radio"><div class="dup-dot"></div></div>
<div><div class="dup-t">Duplicate everything</div><div class="dup-s">Copy all budgets and actuals</div></div>
</div>
</div>
<div class="sh-foot"><button class="primary-btn" onclick="execDup()">Duplicate</button></div>
</div>
</div>

<!-- ADD ITEM -->
<div class="ov" id="ovAddItem" onclick="closeOverlay(event,'ovAddItem')">
<div class="sheet">
<div class="sh-handle"></div>
<div class="sh-title">New Line Item</div>
<div class="sh-body">
<div class="field"><label>Name</label><input type="text" id="niName" placeholder="e.g., Netflix"></div>
<div class="field"><label>Category</label><select id="niCat"></select></div>
<div class="field-2">
<div class="field"><label>Budgeted</label><input type="number" id="niBud" placeholder="0" min="0"></div>
<div class="field"><label>Actual</label><input type="number" id="niAct" placeholder="0" min="0"></div>
</div>
</div>
<div class="sh-foot"><button class="primary-btn" onclick="addItem()">Add Item</button></div>
</div>
</div>

<script>
const MO=['January','February','March','April','May','June','July','August','September','October','November','December'];
const CP=['#34D399','#3B82F6','#8B5CF6','#EC4899','#F59E0B','#EF4444','#10B981','#06B6D4','#6366F1','#84CC16'];

const TEMPLATE=[
  {key:'income',label:'Income',secs:[{key:'inc',label:'Income',rows:[{n:'Paycheck 1',b:0,a:0},{n:'Paycheck 2',b:0,a:0},{n:'Spouse Paycheck 1',b:0,a:0},{n:'Spouse Paycheck 2',b:0,a:0},{n:'Side Hustle',b:0,a:0},{n:'Other Income',b:0,a:0}]}]},
  {key:'giving',label:'Giving',secs:[{key:'giv',label:'Giving',rows:[{n:'Church',b:0,a:0},{n:'Charity',b:0,a:0}]}]},
  {key:'investments',label:'Investments',secs:[{key:'inv',label:'Investments',rows:[{n:'401k',b:0,a:0},{n:'Roth IRA',b:0,a:0},{n:'Taxable Brokerage',b:0,a:0},{n:'Money Market/HYSA',b:0,a:0},{n:'529 Plan',b:0,a:0}]}]},
  {key:'savings',label:'Savings',secs:[{key:'sav',label:'Sinking Funds',rows:[{n:'Car Maintenance',b:0,a:0},{n:'Vacation',b:0,a:0}]}]},
  {key:'housing',label:'Housing',secs:[{key:'hous',label:'Housing',rows:[{n:'Rent/Mortgage',b:0,a:0},{n:'Utilities',b:0,a:0},{n:'Home Insurance',b:0,a:0},{n:'Internet',b:0,a:0},{n:'Property Tax/HOA',b:0,a:0}]}]},
  {key:'transportation',label:'Transportation',secs:[{key:'trans',label:'Transportation',rows:[{n:'Car Payment',b:0,a:0},{n:'Fuel',b:0,a:0},{n:'Car Insurance',b:0,a:0},{n:'Misc',b:0,a:0}]}]},
  {key:'food',label:'Food',secs:[{key:'food',label:'Food',rows:[{n:'Groceries',b:0,a:0},{n:'Dining Out',b:0,a:0}]}]},
  {key:'personal',label:'Personal',secs:[{key:'pers',label:'Personal',rows:[{n:'Personal Care',b:0,a:0},{n:'Shopping',b:0,a:0}]}]},
  {key:'lifestyle',label:'Lifestyle',secs:[{key:'life',label:'Discretionary',rows:[{n:'Gym',b:0,a:0},{n:'Hobbies',b:0,a:0},{n:'Entertainment',b:0,a:0},{n:'Mobile',b:0,a:0}]}]},
  {key:'health',label:'Health & Insurance',secs:[{key:'hlth',label:'Health',rows:[{n:'Health Insurance',b:0,a:0},{n:'Life Insurance',b:0,a:0},{n:'Medical',b:0,a:0}]}]},
  {key:'debt',label:'Debt',secs:[{key:'debt',label:'Debt',rows:[{n:'Credit Cards',b:0,a:0},{n:'Student Loans',b:0,a:0},{n:'Other',b:0,a:0}]}]},
];

let curMo=2, curYr=2026, picYr=2026, dopSel=1;
const DATA={};

const mk=(y,m)=>`${y}-${String(m).padStart(2,'0')}`;
const curKey=()=>mk(curYr,curMo);
function getGroups(){const k=curKey();if(!DATA[k])DATA[k]={groups:JSON.parse(JSON.stringify(TEMPLATE))};return DATA[k].groups}
function allSecs(g){return g.flatMap(x=>x.secs)}
function findSec(g,k){return allSecs(g).find(s=>s.key===k)}

const fmt=v=>v===0?'—':'$'+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtk=v=>v===0?'$0':Math.abs(v)>=1000?'$'+(Math.abs(v)/1000).toFixed(1)+'k':'$'+Math.round(Math.abs(v)).toLocaleString();
const secBud=s=>s.rows.reduce((a,r)=>a+r.b,0);
const secAct=s=>s.rows.reduce((a,r)=>a+r.a,0);
const grpBud=g=>g.secs.reduce((a,s)=>a+secBud(s),0);
const grpAct=g=>g.secs.reduce((a,s)=>a+secAct(s),0);
const totalInc=()=>{const g=getGroups().find(x=>x.key==='income');return g?grpBud(g):0};
const totalExp=()=>getGroups().filter(x=>x.key!=='income').reduce((a,g)=>a+grpBud(g),0);

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}

// EXPORT TO EXCEL
function exportExcel(){
  console.log('Export clicked - XLSX available:', typeof XLSX!=='undefined');
  
  // Try XLSX first
  if(typeof XLSX!=='undefined'){
    try{
      const groups=getGroups();
      if(!groups || groups.length===0){
        alert('No budget data yet. Add some items first.');
        return;
      }
      
      const rows=[];
      rows.push(['LUNLO BUDGET EXPORT']);
      rows.push([MO[curMo]+' '+curYr]);
      rows.push([]);
      
      groups.forEach(g=>{
        rows.push([g.label]);
        rows.push(['Item','Planned','Actual','Difference']);
        
        g.secs.forEach(s=>{
          s.rows.forEach(r=>{
            rows.push([r.n, r.b, r.a, r.b-r.a]);
          });
        });
        
        const budgeted=grpBud(g);
        const actual=grpAct(g);
        rows.push([g.label+' Total', budgeted, actual, budgeted-actual]);
        rows.push([]);
      });
      
      rows.push(['SUMMARY']);
      rows.push(['Total Income', totalInc()]);
      rows.push(['Total Expenses', totalExp()]);
      rows.push(['Net', totalInc()-totalExp()]);
      
      const ws=XLSX.utils.aoa_to_sheet(rows);
      ws['!cols']=[{wch:30},{wch:15},{wch:15},{wch:15}];
      
      const wb=XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb,ws,'Budget');
      
      const filename='Lunlo_'+MO[curMo]+'_'+curYr+'.xlsx';
      XLSX.writeFile(wb,filename);
      
      toast('✓ Exported to '+filename);
      return;
    }catch(e){
      console.error('XLSX export failed:', e);
    }
  }
  
  // Fallback to CSV export
  console.log('Using CSV fallback export');
  exportToCSV();
}

function exportToCSV(){
  try{
    const groups=getGroups();
    if(!groups || groups.length===0){
      alert('No budget data yet. Add some items first.');
      return;
    }
    
    let csv='LUNLO BUDGET EXPORT\n';
    csv+=MO[curMo]+' '+curYr+'\n\n';
    
    groups.forEach(g=>{
      csv+=g.label+'\n';
      csv+='Item,Planned,Actual,Difference\n';
      
      g.secs.forEach(s=>{
        s.rows.forEach(r=>{
          csv+='"'+r.n+'",'+r.b+','+r.a+','+(r.b-r.a)+'\n';
        });
      });
      
      const budgeted=grpBud(g);
      const actual=grpAct(g);
      csv+=g.label+' Total,'+budgeted+','+actual+','+(budgeted-actual)+'\n\n';
    });
    
    csv+='\nSUMMARY\n';
    csv+='Total Income,'+totalInc()+'\n';
    csv+='Total Expenses,'+totalExp()+'\n';
    csv+='Net,'+(totalInc()-totalExp())+'\n';
    
    // Create blob and download
    const blob=new Blob([csv],{type:'text/csv'});
    const url=window.URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download='Lunlo_'+MO[curMo]+'_'+curYr+'.csv';
    document.body.appendChild(a);
    a.click();
    window.URL.revokeObjectURL(url);
    document.body.removeChild(a);
    
    toast('✓ Exported to CSV');
  }catch(e){
    console.error('CSV export failed:', e);
    alert('Export failed: '+e.message);
  }
}

// VIEWS
function sv(v){
  ['dash','budget'].forEach(id=>{
    const el=document.getElementById('view-'+id);
    const btn=document.getElementById('nav'+id.charAt(0).toUpperCase()+id.slice(1));
    if(el){el.classList.toggle('active',id===v)}
    if(btn){btn.classList.toggle('active',id===v)}
  });
  if(v==='dash')rDash();
  if(v==='budget')rBudget();
}

function updLabel(){
  const l=`${MO[curMo]} ${curYr}`;
  document.getElementById('moLabel').textContent=l;
  document.getElementById('bvMonth').textContent=l;
}

// DASHBOARD
function rDash(){
  const groups=getGroups();
  const iB=totalInc(), eB=totalExp(), net=iB-eB;
  
  document.getElementById('dashC').innerHTML=`
    <div class="hero">
      <div class="hero-label">${MO[curMo]} ${curYr}</div>
      <div class="hero-amount ${net<0?'neg':''}">$${Math.abs(net).toLocaleString()}</div>
      <div class="hero-sub">${net>=0?'Available to allocate':'Over budget'}</div>
      <div class="hero-stats">
        <div class="hstat"><div class="hstat-v">${fmtk(iB)}</div><div class="hstat-l">Income</div></div>
        <div class="hstat"><div class="hstat-v ${eB>iB?'neg':''}">${fmtk(eB)}</div><div class="hstat-l">Expenses</div></div>
        <div class="hstat"><div class="hstat-v">${Math.round((iB>0?(iB-eB)/iB*100:0))}%</div><div class="hstat-l">Savings</div></div>
      </div>
    </div>
    ${iB===0?`<div class="card"><div class="empty-state"><div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div><div class="empty-title">No budget yet</div><div class="empty-sub">Go to Budget tab to start tracking.</div></div></div>`:''}
  `;
}

// BUDGET
function rBudget(){
  const groups=getGroups();
  const iB=totalInc(), eB=totalExp(), net=iB-eB;
  
  document.getElementById('bvStrip').innerHTML=`
    <div class="bvs"><div class="bvs-eye">Income</div><div class="bvs-val">${fmtk(iB)}</div></div>
    <div class="bvs"><div class="bvs-eye">Expenses</div><div class="bvs-val ${eB>iB?'neg':''}">${fmtk(eB)}</div></div>
    <div class="bvs"><div class="bvs-eye">Left</div><div class="bvs-val ${net>0?'pos':net<0?'neg':''}">${net>=0?'+':''}${fmtk(net)}</div></div>
  `;
  
  const cont=document.getElementById('bvGroups');
  cont.innerHTML='';
  
  groups.forEach(grp=>{
    const gb=grpBud(grp), ga=grpAct(grp);
    const items=grp.secs.reduce((a,s)=>a+s.rows.length,0);
    const gc=document.createElement('div');
    gc.className='bv-group';
    
    gc.innerHTML=`
      <div class="grp-head">
        <div class="grp-head-left"><div class="grp-name">${grp.label}</div><div class="grp-badge">${items}</div></div>
        <div class="grp-stats">
          <div class="grp-stat"><div class="grp-stat-lbl">Budget</div><div class="grp-stat-val">${gb?fmt(gb):'—'}</div></div>
          <div class="grp-stat"><div class="grp-stat-lbl">Actual</div><div class="grp-stat-val">${ga?fmt(ga):'—'}</div></div>
        </div>
      </div>
      <div class="col-row"><div>Line Item</div><div>Budgeted</div><div>Actual</div></div>
    `;
    
    grp.secs.forEach(sec=>{
      sec.rows.forEach((row,ri)=>{
        const el=document.createElement('div');
        el.className='bv-row';
        el.innerHTML=`
          <div class="row-name">${row.n}<button class="del-btn" onclick="delRow('${sec.key}',${ri})">✕</button></div>
          <div class="inp-wrap"><span class="inp-sym">$</span><input class="num-inp" type="number" min="0" step="1" placeholder="0" value="${row.b||''}" oninput="upd('${sec.key}',${ri},'b',this.value)"></div>
          <div class="inp-wrap"><span class="inp-sym">$</span><input class="num-inp" type="number" min="0" step="1" placeholder="0" value="${row.a||''}" oninput="upd('${sec.key}',${ri},'a',this.value)"></div>
        `;
        gc.appendChild(el);
      });
      
      const ab=document.createElement('button');
      ab.className='add-row-btn';
      ab.innerHTML=`<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><line x1="6" y1="2" x2="6" y2="10"/><line x1="2" y1="6" x2="10" y2="6"/></svg>Add item`;
      ab.onclick=()=>openAddItem(sec.key);
      gc.appendChild(ab);
    });
    
    cont.appendChild(gc);
  });
}

function upd(sk,i,f,v){const sec=findSec(getGroups(),sk);if(sec)sec.rows[i][f]=parseFloat(v)||0;saveData();rBudget()}
function delRow(sk,i){const sec=findSec(getGroups(),sk);if(sec){sec.rows.splice(i,1);saveData();rBudget();toast('Item removed')}}

// MONTH PICKER
function openMoPicker(){picYr=curYr;rMoGrid();document.getElementById('ovMo').classList.add('open')}
function rMoGrid(){
  document.getElementById('picYrLbl').textContent=picYr;
  document.getElementById('moPicGrid').innerHTML=MO.map((n,i)=>{
    const k=mk(picYr,i), has=!!DATA[k], active=i===curMo&&picYr===curYr;
    return `<div class="mo-pick-item${active?' active':''}${has?' active':''}" onclick="selMo(${i})"><div class="mn">${n.slice(0,3)}</div></div>`;
  }).join('');
}
function chPicYr(d){picYr+=d;rMoGrid()}
function selMo(m){curMo=m;curYr=picYr;updLabel();document.getElementById('ovMo').classList.remove('open');const av=['dash','budget'].find(v=>document.getElementById('view-'+v).classList.contains('active'));sv(av||'dash');toast(`${MO[m]} ${curYr}`)}

// DUPLICATE
function openDup(){let nm=curMo+1,ny=curYr;if(nm>11){nm=0;ny++;}document.getElementById('dupMo').value=nm;document.getElementById('dupYr').value=ny;document.getElementById('ovDup').classList.add('open')}
function selDop(n){dopSel=n;document.getElementById('dop1').classList.toggle('sel',n===1);document.getElementById('dop2').classList.toggle('sel',n===2)}
function execDup(){
  const tm=parseInt(document.getElementById('dupMo').value), ty=parseInt(document.getElementById('dupYr').value);
  const deep=JSON.parse(JSON.stringify(getGroups()));
  if(dopSel===1)deep.forEach(g=>g.secs.forEach(s=>s.rows.forEach(r=>r.a=0)));
  DATA[mk(ty,tm)]={groups:deep};
  saveData();
  document.getElementById('ovDup').classList.remove('open');
  curMo=tm;curYr=ty;
  updLabel();
  sv('budget');
  toast(`Duplicated to ${MO[tm]} ${ty}`);
}

// ADD ITEM
function openAddItem(k){
  const secs=allSecs(getGroups());
  document.getElementById('niCat').innerHTML=secs.map(s=>`<option value="${s.key}"${s.key===k?' selected':''}>${s.label}</option>`).join('');
  document.getElementById('niName').value='';
  document.getElementById('niBud').value='';
  document.getElementById('niAct').value='';
  document.getElementById('ovAddItem').classList.add('open');
}
function addItem(){
  const name=document.getElementById('niName').value.trim();
  if(!name)return;
  const sk=document.getElementById('niCat').value;
  const b=parseFloat(document.getElementById('niBud').value)||0;
  const a=parseFloat(document.getElementById('niAct').value)||0;
  const sec=findSec(getGroups(),sk);
  if(sec)sec.rows.push({n:name,b,a});
  saveData();
  document.getElementById('ovAddItem').classList.remove('open');
  rBudget();
  toast('Item added');
}

// OVERLAYS
function closeOverlay(e,id){if(!e||e.target===document.getElementById(id))document.getElementById(id).classList.remove('open')}

// PERSIST
function saveData(){try{localStorage.setItem('lunlo_data',JSON.stringify(DATA));}catch(e){console.log('Storage failed')}}
(function(){try{const s=localStorage.getItem('lunlo_data');if(s)Object.assign(DATA,JSON.parse(s));}catch(e){}})();

// INIT
getGroups();updLabel();rDash();

// SERVICE WORKER
if('serviceWorker' in navigator){
  const code=`const CA='lunlo-v4';self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CA).map(k=>caches.delete(k)))).then(()=>clients.claim())));self.addEventListener('fetch',e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).catch(()=>caches.match(e.request)))));`;
  const blob=new Blob([code],{type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}
